name: Build Testy LRNS WPF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Stažení repozitáře
      uses: actions/checkout@v4

    - name: Nastavení .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Obnova závislostí (Restore)
      # ⚠️ Zde je oprava: Míříme přímo na složku s projektem a .csproj soubor
      run: dotnet restore TestyLRNS_WPF/TestyLRNS_WPF.csproj

    - name: Kompilace projektu (Build)
      # ⚠️ Zde je oprava: Míříme na .csproj a necháváme projekt, ať si sám určí x64 architekturu
      run: dotnet build TestyLRNS_WPF/TestyLRNS_WPF.csproj --configuration Release --no-restore

    - name: Nahrání zkompilované aplikace (Artefakt ke stažení)
      uses: actions/upload-artifact@v4
      with:
        name: ZkusebniSystem-LRNS-Aplikace
        path: TestyLRNS_WPF/bin/Release/net10.0-windows/
        retention-days: 14
